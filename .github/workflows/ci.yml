name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"
  PNPM_VERSION: "9"

jobs:
  # ─── TypeScript Packages & Apps ─────────────────────────────────────────────
  typescript-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check all packages
        run: pnpm typecheck

  # ─── Lint ───────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  # ─── Tests ──────────────────────────────────────────────────────────────────
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:ci

  # ─── Python AI Service ──────────────────────────────────────────────────────
  test-python:
    name: Python AI Service Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: apps/ai-service
        run: uv pip install -e ".[dev]" --system

      - name: Lint with Ruff
        working-directory: apps/ai-service
        run: |
          pip install ruff
          ruff check app/ tests/

      - name: Type check with mypy
        working-directory: apps/ai-service
        run: |
          pip install mypy
          mypy app/ --ignore-missing-imports

      - name: Run tests
        working-directory: apps/ai-service
        run: pytest tests/ -v --tb=short
        env:
          ENVIRONMENT: test
          AI_SERVICE_API_KEY: test-key-for-ci-minimum-32-characters
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"

  # ─── Security Checks ────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Check .env files not committed
        run: |
          if find . -name ".env" -not -name ".env.example" -not -path "*/node_modules/*" | grep -q .; then
            echo "ERROR: .env file found in repository!"
            exit 1
          fi
          echo "No .env files found — OK"

  # ─── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build All Apps
    runs-on: ubuntu-latest
    needs: [typescript-check, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages first
        run: pnpm build:packages

      - name: Build API
        run: pnpm --filter @lawgic/api build

      - name: Build Worker
        run: pnpm --filter @lawgic/worker build
