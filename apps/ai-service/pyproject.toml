# =============================================================================
# LAWgic AI Service — FastAPI
# Handles: OCR, document classification, extraction, embeddings, RAG, translation
# NEVER handles: authentication (delegated to API), business logic, user management
# =============================================================================

[project]
name = "lawgic-ai-service"
version = "0.1.0"
description = "LAWgic AI Service — Document processing, RAG, and LLM orchestration"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "python-jose[cryptography]>=3.3.0",
    "structlog>=25.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
    # AI Providers (start with cheapest, add others as needed)
    "google-generativeai>=0.8.0",
    "openai>=1.57.0",
    # Embeddings (local multilingual model for cost control)
    "sentence-transformers>=3.3.0",
    # Vector operations
    "numpy>=2.0.0",
    # PDF processing
    "pdfplumber>=0.11.0",
    "pypdf>=5.0.0",
    # OCR (local fallback during development)
    "pytesseract>=0.3.13",
    "Pillow>=11.0.0",
    # Database
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    # Redis
    "redis>=5.2.0",
    # Data validation (pydantic handles all validation)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "black>=24.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "COM", "C4", "DTZ", "T20", "RET", "SIM"]
ignore = ["S101", "COM812"]  # Allow assert in tests, trailing comma

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.black]
line-length = 120
target-version = ["py311"]
